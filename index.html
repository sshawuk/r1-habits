<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Habits</title>
<style>
:root{--bg:#000;--fg:#f4f4f4;--mute:#7a7a7a;--line:#262626;--card:#121212;--acc:#FE5000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,Roboto,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{width:240px;height:282px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
header,footer{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
header{height:36px}
footer{height:34px;border-top:1px solid var(--line)}
.t{flex:1;text-align:center;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:30px;height:30px;border:0;background:none;color:var(--fg);font-size:20px;line-height:30px;border-radius:8px;display:inline-block;text-align:center}
.ib:active{background:var(--card)}
.ib:disabled{opacity:.2}
main{flex:1;overflow-y:auto;padding:4px 8px 6px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.empty{color:var(--mute);text-align:center;font-size:13px;line-height:1.5;margin-top:60px}

/* today */
.row{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;background:var(--card);border:1.5px solid transparent;border-radius:10px;padding:9px 10px;margin-bottom:6px;color:var(--fg);text-align:left;font-size:14px}
.row.sel{border-color:var(--acc)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.ok .nm{color:var(--mute)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #444;display:grid;place-items:center;font-size:13px;font-weight:800;color:#000}
.row.ok .chk{background:var(--acc);border-color:var(--acc)}
.amt{font-variant-numeric:tabular-nums;font-weight:600}
.amt i{font-style:normal;font-weight:400;color:var(--mute);font-size:11px}
.bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--acc);transition:width .2s}
.sum{font-size:13px;color:var(--mute)}
.sum b{color:var(--fg)}

/* amount */
.qty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ring{width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p) * 360deg),var(--line) 0);display:grid;place-items:center}
.ring>div{width:114px;height:114px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring input{width:100px;background:none;border:0;color:var(--fg);font-family:inherit;font-size:30px;font-weight:700;text-align:center;outline:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.ring input::-webkit-outer-spin-button,.ring input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ring small{font-size:11px;color:var(--mute)}
.steps{display:flex;gap:10px}
.steps button{width:94px;height:34px;border:0;border-radius:17px;background:var(--card);color:var(--fg);font-size:15px;font-weight:600}
.steps button:active{background:var(--acc);color:#000}
.hint{justify-content:center;font-size:10px;color:var(--mute)}

/* week */
.wk{display:grid;grid-template-columns:1fr repeat(7,15px) 24px;gap:7px 3px;align-items:center;padding-top:4px}
.wk .h{color:var(--mute);text-align:center;font-size:10px}
.wk .n{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:4px}
.c{width:15px;height:15px;border-radius:4px;background:var(--line)}
.c.p{background:rgba(254,80,0,.35)}
.c.f{background:var(--acc)}
.st{text-align:right;color:var(--acc);font-size:12px;font-weight:700}

/* manage */
.mrow{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.mname{flex:1;min-width:0;text-align:left;background:var(--card);border:0;border-radius:10px;padding:8px 10px;color:var(--fg);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mname small{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.add{width:100%;height:36px;border:1.5px dashed #444;border-radius:10px;background:none;color:var(--acc);font-size:14px;font-weight:600}

/* edit */
.form label{display:block;font-size:11px;color:var(--mute);margin:7px 0 3px}
.form input{width:100%;height:30px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:0 8px;font-size:14px;font-family:inherit;-webkit-user-select:text;user-select:text}
.form input:focus{border-color:var(--acc);outline:none}
.form input.bad{border-color:#c33}
.seg{display:flex;background:var(--card);border-radius:8px;padding:2px}
.seg button{flex:1;height:26px;border:0;background:none;color:var(--mute);border-radius:6px;font-size:13px}
.seg button.on{background:var(--acc);color:#000;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{height:28px;padding:0 16px;border-radius:14px;border:0;font-size:13px;font-weight:600}
.btn.pri{background:var(--acc);color:#000}
.btn.ghost{background:var(--card);color:var(--fg)}
.btn.warn{background:#5a1a10;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var KEY = 'habits_v1';
  var DEFAULT = {
    habits: [
      { id: 'h1', name: 'No alcohol', type: 'bool' },
      { id: 'h2', name: 'Water', type: 'qty', target: 2, unit: 'L', step: 0.25 }
    ],
    log: {}
  };
  var S = null;
  var ui = { view: 'today', sel: 0, day: 0, qid: null, draft: null, confirm: false };
  var app = document.getElementById('app');

  /* ---------- storage: R1 creationStorage (base64) with localStorage fallback ---------- */
  function enc(s){ return btoa(unescape(encodeURIComponent(s))); }
  function dec(s){ return decodeURIComponent(escape(atob(s))); }
  var store = {
    get: function(){
      return new Promise(function(resolve){
        var fallback = function(){
          try { var v = localStorage.getItem(KEY); resolve(v ? JSON.parse(v) : null); }
          catch(e){ resolve(null); }
        };
        try {
          if (window.creationStorage && window.creationStorage.plain) {
            Promise.resolve(window.creationStorage.plain.getItem(KEY)).then(function(v){
              if (v) { try { resolve(JSON.parse(dec(v))); return; } catch(e){} }
              fallback();
            }, fallback);
            return;
          }
        } catch(e){}
        fallback();
      });
    },
    set: function(o){
      var j = JSON.stringify(o);
      try { if (window.creationStorage && window.creationStorage.plain) window.creationStorage.plain.setItem(KEY, enc(j)); } catch(e){}
      try { localStorage.setItem(KEY, j); } catch(e){}
    }
  };
  function save(){ store.set(S); }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function r2(n){ return Math.round(n * 100) / 100; }
  function fmt(n){ return String(r2(+n || 0)); }
  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
  function dayDate(off){ var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + off); return d; }
  function dkey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function curKey(){ return dkey(dayDate(ui.day)); }
  function dayLabel(off){
    if (off === 0) return 'Today';
    if (off === -1) return 'Yesterday';
    return dayDate(off).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function val(h, k){ var l = S.log[k]; return l && l[h.id] != null ? l[h.id] : (h.type === 'bool' ? false : 0); }
  function setVal(h, k, v){ (S.log[k] || (S.log[k] = {}))[h.id] = v; save(); }
  function pct(h, k){ var v = val(h, k); return h.type === 'bool' ? (v ? 1 : 0) : Math.min(1, v / (h.target || 1)); }
  function done(h, k){ return pct(h, k) >= 1; }
  function streak(h){
    var off = done(h, dkey(dayDate(0))) ? 0 : -1, n = 0;
    while (n < 3650 && done(h, dkey(dayDate(off)))) { n++; off--; }
    return n;
  }
  function byId(id){ for (var i = 0; i < S.habits.length; i++) if (S.habits[i].id === id) return S.habits[i]; return null; }

  /* ---------- views ---------- */
  function hdr(title, backAct, right){
    return '<header>' + (backAct ? '<button class="ib" data-act="' + backAct + '">\u2039</button>' : '<span class="ib"></span>') +
      '<div class="t">' + title + '</div>' + (right || '<span class="ib"></span>') + '</header>';
  }

  function vToday(){
    var k = curKey(), hs = S.habits, n = 0;
    hs.forEach(function(h){ if (done(h, k)) n++; });
    var rows = hs.length ? hs.map(function(h, i){
      var cls = 'row' + (i === ui.sel ? ' sel' : '') + (done(h, k) ? ' ok' : '');
      if (h.type === 'bool') {
        return '<button class="' + cls + '" data-act="tap" data-i="' + i + '"><span class="nm">' + esc(h.name) + '</span><span class="chk">' + (val(h, k) ? '\u2713' : '') + '</span></button>';
      }
      return '<button class="' + cls + '" data-act="tap" data-i="' + i + '"><span class="nm">' + esc(h.name) + '</span>' +
        '<span class="amt">' + fmt(val(h, k)) + '<i> / ' + fmt(h.target) + ' ' + esc(h.unit) + '</i></span>' +
        '<span class="bar"><span style="width:' + (pct(h, k) * 100) + '%"></span></span></button>';
    }).join('') : '<p class="empty">No habits yet.<br>Tap \u2699 to add one.</p>';
    return '<header><button class="ib" data-act="prev">\u2039</button><div class="t">' + dayLabel(ui.day) + '</div>' +
      '<button class="ib" data-act="next"' + (ui.day >= 0 ? ' disabled' : '') + '>\u203A</button></header>' +
      '<main id="list">' + rows + '</main>' +
      '<footer><button class="ib" data-act="week" aria-label="Week">\u25A6</button><div class="sum"><b>' + n + '</b> / ' + hs.length + ' done</div>' +
      '<button class="ib" data-act="manage" aria-label="Settings">\u2699</button></footer>';
  }

  function vQty(){
    var h = byId(ui.qid), k = curKey();
    return hdr(esc(h.name), 'back') +
      '<main class="qty"><div class="ring" style="--p:' + pct(h, k) + '"><div>' +
      '<input id="qv" type="number" inputmode="decimal" step="any" min="0" value="' + fmt(val(h, k)) + '">' +
      '<small>of ' + fmt(h.target) + ' ' + esc(h.unit) + '</small></div></div>' +
      '<div class="steps"><button data-act="dec">\u2212' + fmt(h.step) + '</button><button data-act="inc">+' + fmt(h.step) + '</button></div></main>' +
      '<footer class="hint">wheel \u00B1' + fmt(h.step) + ' \u00B7 tap number to type \u00B7 side button = back</footer>';
  }

  function vWeek(){
    var days = [];
    for (var j = 6; j >= 0; j--) days.push(dayDate(ui.day - j));
    var g = '<span></span>' + days.map(function(d){ return '<span class="h">' + 'SMTWTFS'[d.getDay()] + '</span>'; }).join('') + '<span></span>';
    S.habits.forEach(function(h){
      g += '<span class="n">' + esc(h.name) + '</span>';
      days.forEach(function(d){ var p = pct(h, dkey(d)); g += '<span class="c' + (p >= 1 ? ' f' : p > 0 ? ' p' : '') + '"></span>'; });
      g += '<span class="st">' + streak(h) + '</span>';
    });
    return hdr('Last 7 days', 'back') + '<main id="scroller"><div class="wk">' + g + '</div></main>' +
      '<footer class="hint">orange = hit \u00B7 faint = partial \u00B7 number = streak</footer>';
  }

  function vManage(){
    var list = S.habits.map(function(h, i){
      return '<div class="mrow"><button class="mname" data-act="edit" data-i="' + i + '">' + esc(h.name) +
        '<small>' + (h.type === 'bool' ? 'Yes / No' : 'Target ' + fmt(h.target) + ' ' + esc(h.unit)) + '</small></button>' +
        '<button class="ib" data-act="up" data-i="' + i + '"' + (i ? '' : ' disabled') + '>\u2191</button></div>';
    }).join('');
    return hdr('Habits', 'back') + '<main id="scroller">' + list + '<button class="add" data-act="add">+ Add habit</button></main>' +
      '<footer class="hint">version 3</footer>';
  }

  function vEdit(){
    var d = ui.draft, isNew = !byId(d.id);
    var qty = d.type === 'qty' ?
      '<div class="two"><div><label>Daily target</label><input data-f="target" type="number" inputmode="decimal" step="any" value="' + fmt(d.target) + '"></div>' +
      '<div><label>Unit</label><input data-f="unit" maxlength="6" placeholder="L, mins" value="' + esc(d.unit) + '"></div></div>' +
      '<label>Step per wheel click</label><input data-f="step" type="number" inputmode="decimal" step="any" value="' + fmt(d.step) + '">' : '';
    return hdr(isNew ? 'New habit' : 'Edit habit', 'manage') +
      '<main id="scroller" class="form"><label>Name</label><input id="fname" data-f="name" maxlength="24" placeholder="e.g. Read 20 pages" value="' + esc(d.name) + '">' +
      '<label>Type</label><div class="seg"><button data-act="type" data-t="bool" class="' + (d.type === 'bool' ? 'on' : '') + '">Yes / No</button>' +
      '<button data-act="type" data-t="qty" class="' + (d.type === 'qty' ? 'on' : '') + '">Amount</button></div>' + qty + '</main>' +
      '<footer>' + (isNew ? '<span></span>' : '<button class="btn ' + (ui.confirm ? 'warn' : 'ghost') + '" data-act="del">' + (ui.confirm ? 'Really delete?' : 'Delete') + '</button>') +
      '<button class="btn pri" data-act="save">Save</button></footer>';
  }

  function render(){
    var v = ui.view;
    app.innerHTML = v === 'qty' ? vQty() : v === 'week' ? vWeek() : v === 'manage' ? vManage() : v === 'edit' ? vEdit() : vToday();
    if (v === 'today') {
      var s = app.querySelector('.row.sel');
      if (s && s.scrollIntoView) s.scrollIntoView({ block: 'nearest' });
    }
  }

  /* ---------- actions ---------- */
  function go(view){ ui.view = view; ui.confirm = false; render(); }
  function activate(i){
    var h = S.habits[i]; if (!h) return;
    ui.sel = i;
    if (h.type === 'bool') { setVal(h, curKey(), !val(h, curKey())); render(); }
    else { ui.qid = h.id; go('qty'); }
  }
  function adjust(dir){
    var h = byId(ui.qid), k = curKey();
    setVal(h, k, r2(Math.max(0, val(h, k) + dir * (h.step || 1))));
    render();
  }
  function saveDraft(){
    var d = ui.draft, name = (d.name || '').trim();
    if (!name) { var f = document.getElementById('fname'); f.classList.add('bad'); f.focus(); return; }
    var h = { id: d.id, name: name, type: d.type };
    if (d.type === 'qty') {
      h.target = d.target > 0 ? r2(d.target) : 1;
      h.unit = (d.unit || '').trim();
      h.step = d.step > 0 ? r2(d.step) : 1;
    }
    var ex = byId(d.id);
    if (ex) S.habits[S.habits.indexOf(ex)] = h; else S.habits.push(h);
    save(); go('manage');
  }

  app.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
    switch (a) {
      case 'tap': activate(i); break;
      case 'prev': ui.day--; render(); break;
      case 'next': if (ui.day < 0) { ui.day++; render(); } break;
      case 'back': go('today'); break;
      case 'week': go('week'); break;
      case 'manage': go('manage'); break;
      case 'inc': adjust(1); break;
      case 'dec': adjust(-1); break;
      case 'add': ui.draft = { id: 'h' + Date.now(), name: '', type: 'bool', target: 1, unit: '', step: 1 }; go('edit'); break;
      case 'edit': var h = S.habits[i]; ui.draft = { id: h.id, name: h.name, type: h.type, target: h.target || 1, unit: h.unit || '', step: h.step || 1 }; go('edit'); break;
      case 'type': ui.draft.type = b.getAttribute('data-t'); render(); break;
      case 'up': if (i > 0) { var t = S.habits[i]; S.habits[i] = S.habits[i-1]; S.habits[i-1] = t; save(); render(); } break;
      case 'save': saveDraft(); break;
      case 'del':
        if (!ui.confirm) { ui.confirm = true; render(); break; }
        S.habits = S.habits.filter(function(x){ return x.id !== ui.draft.id; });
        ui.sel = clamp(ui.sel, 0, Math.max(0, S.habits.length - 1));
        save(); go('manage'); break;
    }
  });
  app.addEventListener('input', function(e){
    var f = e.target.getAttribute('data-f');
    if (f && ui.draft) ui.draft[f] = (f === 'name' || f === 'unit') ? e.target.value : parseFloat(e.target.value);
    if (f === 'name') e.target.classList.remove('bad');
  });
  app.addEventListener('change', function(e){
    if (e.target.id === 'qv') { setVal(byId(ui.qid), curKey(), r2(Math.max(0, parseFloat(e.target.value) || 0))); render(); }
  });
  app.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.target.blur(); if (ui.view === 'edit') saveDraft(); }
  });

  /* ---------- R1 hardware: scroll wheel + side (PTT) button ---------- */
  function wheel(d){
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (ui.view === 'today' && S.habits.length) { ui.sel = clamp(ui.sel + d, 0, S.habits.length - 1); render(); }
    else if (ui.view === 'qty') adjust(-d);
    else { var sc = document.getElementById('scroller'); if (sc) sc.scrollTop += d * 40; }
  }
  function side(){
    if (ui.view === 'today') activate(ui.sel);
    else if (ui.view === 'qty' || ui.view === 'week' || ui.view === 'manage') go('today');
  }
  // Wheel direction flipped to feel natural on the R1
  window.addEventListener('scrollDown', function(){ wheel(-1); });
  window.addEventListener('scrollUp', function(){ wheel(1); });
  window.addEventListener('sideClick', side);
  // Keyboard equivalents for testing in a desktop browser
  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowDown') { e.preventDefault(); wheel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); wheel(-1); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); side(); }
  });
  // Re-render when the device wakes so "Today" rolls over at midnight
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && S) render(); });

  store.get().then(function(d){
    S = d && d.habits ? d : JSON.parse(JSON.stringify(DEFAULT));
    if (!S.log) S.log = {};
    render();
  });
})();
</script>
</body>
</html>
